[project]
name = "moamong-product-mapper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "chromadb>=1.1.13",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "requests>=2.32"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
